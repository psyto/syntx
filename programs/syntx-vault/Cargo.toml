[package]
name = "syntx-vault"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1" }
anchor-spl = { version = "0.30.1", features = ["token"] }

[dev-dependencies]
litesvm = "0.1"
solana-sdk = "1.18"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
